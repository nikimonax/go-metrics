version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goconst
    - gocyclo
    - dupl
    - misspell
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
  exclusions:
    rules:
      - text: 'string `(success|error)` has [0-9]+ occurrences'
        linters:
          - goconst
      - text: '^(package-comments|exported):'
        linters:
          - revive
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 3
      min-occurrences: 3
    dupl:
      threshold: 100

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 1m
  issues-exit-code: 1
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
