version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goconst
    - gocyclo
    - dupl
    - misspell
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
    - depguard
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      ignore-tests: true
    dupl:
      threshold: 100
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    depguard:
      rules:
        domain-layer:
          files:
            - "**/internal/domain/**"
            - "!$test"
          allow:
            - $gostd
        application-layer:
          files:
            - "**/internal/app/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/nikimonax/go-metrics/internal/app
            - github.com/nikimonax/go-metrics/internal/domain
        infrastructure-layer:
          files:
            - "**/internal/impl/**"
            - "!$test"
          deny:
            - pkg: github.com/nikimonax/go-metrics/internal/server
              desc: impl must not depend on server
            - pkg: github.com/nikimonax/go-metrics/internal/testing
              desc: impl must not depend on testing helpers
            - pkg: github.com/nikimonax/go-metrics/cmd
              desc: impl must not depend on cmd

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nikimonax/go-metrics

run:
  timeout: 1m
  issues-exit-code: 1
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
