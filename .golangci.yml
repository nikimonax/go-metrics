version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - goconst
    - gocyclo
    - dupl
    - misspell
    - revive
    - bodyclose
    - noctx
    - sqlclosecheck
  settings:
    gocyclo:
      min-complexity: 15
    goconst:
      ignore-tests: true
    dupl:
      threshold: 100
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nikimonax/go-metrics

run:
  timeout: 1m
  issues-exit-code: 1
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
